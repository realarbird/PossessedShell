[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "possessed-shell"
version = "0.1.0"
description = "A haunted terminal daemon: a Victorian ghost (Gemma 2 via Ollama) that mourns your failed commands and tells you how to fix them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sentry-sdk>=2.40,<3",
    "rich>=13.7",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
backboard = ["backboard-sdk>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
possessed-shell = "possessed_shell.cli:main"

[tool.setuptools]
packages = ["possessed_shell"]

[tool.setuptools.package-data]
possessed_shell = ["hooks/*.zsh", "hooks/*.bash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
